/* =========================================================

const SUPABASE_URL =
"https://rhzsfjolkxqovhonylti.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DjOGYqDCgPNMngD7mwMmcw_BM-UUCg8";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
PROPERTY ID
========================================================= */

const params =
new URLSearchParams(
window.location.search
);

params.get("id");


/* =========================================================
ESCAPE HTML
========================================================= */

function esc(value){

if(
value === null ||
value === undefined
){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
GALLERY
========================================================= */

let images = [];
let imageIndex = 0;


/* =========================================================
PRICE FORMAT
========================================================= */

function priceText(value){

if(!value){
return "Price on Call";
}

let text =
String(value).trim();

if(
/PKR|lakh|lac|crore|million|arab/i.test(text)
){
return text;
}

let number =
Number(
text.replace(/,/g,"")
);

if(isNaN(number)){
return text;
}

if(number >= 10000000){

return "PKR " +
(
number / 10000000
).toFixed(2)
.replace(".00","") +
" Crore";

}

if(number >= 100000){

return "PKR " +
(
number / 100000
).toFixed(2)
.replace(".00","") +
" Lakh";

}

return "PKR " +
number.toLocaleString();

}


/* =========================================================
POSTED DATE
========================================================= */

function postedDate(value){

if(!value){
return "Recently added";
}

const date =
new Date(value);

if(isNaN(date.getTime())){
return "Recently added";
}

const days =
Math.floor(
(
Date.now() -
date.getTime()
) / 86400000
);

if(days <= 0){
return "Added today";
}

if(days === 1){
return "Added 1 day ago";
}

if(days < 30){
return "Added " +
days +
" days ago";
}

return "Added on " +
date.toLocaleDateString();

}


/* =========================================================
LOAD PROPERTY
========================================================= */

async function loadProperty(){

const container =
document.getElementById(
"propertyContainer"
);

if(!propertyId){

container.className =
"error";

container.innerHTML = `

❌ Property ID missing.

<br><br>

<a
href="index.html#properties"
style="
color:#c40000;
font-weight:bold;
">

← Back to Properties

</a>

`;

return;

}


try{

const response =
await supabaseClient
.from("properties")
.select("*")
.eq("id",propertyId)
.single();

if(response.error){
throw response.error;
}

const property =
response.data;

if(!property){
throw new Error(
"Property not found"
);
}


/* =========================================================
IMAGES
========================================================= */

if(
Array.isArray(
property.image_urls
)
){

images =
property.image_urls.filter(
function(url){

return (
url &&
typeof url === "string"
);

}
);

}


/* =========================================================
DATA
========================================================= */

const type =
property.property_type ||
"Property";

const purpose =
property.purpose ||
"For Sale";

const size =
property.property_size ||
"Not specified";

const location =
property.location ||
"Army Welfare Trust Phase 2, Lahore";

const details =
property.details ||
"No description available.";

const price =
priceText(
property.price
);

const posted =
postedDate(
property.created_at
);


/* =========================================================
GALLERY HTML
========================================================= */

let galleryHTML = "";


if(images.length > 0){

galleryHTML = `

<div class="gallery">

<div class="gallery-main">

<img
id="mainImage"
src="${esc(images[0])}"
alt="${esc(type)} property in AWT Phase 2"
loading="eager">

${
images.length > 1
?
`

<button
class="gallery-arrow left"
onclick="prevImage()"
aria-label="Previous image">
‹
</button>

<button
class="gallery-arrow right"
onclick="nextImage()"
aria-label="Next image">
›
</button>

`
:
""
}

<div class="gallery-counter">

📷
<span id="imageNumber">1</span>
/
${images.length}

</div>

</div>


${
images.length > 1
?
`

<div class="thumbnails">

${images.map(
function(url,index){

return `

<img
class="thumbnail ${
index === 0
? "active"
: ""
}"
src="${esc(url)}"
onclick="showImage(${index})"
alt="Property image ${index + 1}"
loading="lazy">

`;

}
).join("")}

</div>

`
:
""
}

</div>

`;

}else{

galleryHTML = `

<div class="gallery">

<div class="gallery-main">

<div class="no-image">

📷 No Property Image

</div>

</div>

</div>

`;

}


/* =========================================================
FEATURES
========================================================= */

let features = [];

if(property.property_type){
features.push(
property.property_type
);
}

if(property.property_size){
features.push(
property.property_size
);
}

if(property.purpose){
features.push(
property.purpose
);
}

features.push(
"Army Welfare Trust Phase 2"
);

features.push(
"Prime Location"
);

features.push(
"Authorized Dealer"
);

features =
[...new Set(features)];


/* =========================================================
PAGE
========================================================= */

container.className = "";

container.innerHTML = `

<a href="index.html">
Home
</a>

<span>›</span>

<a href="index.html#properties">
Properties

<span>›</span>

${galleryHTML}

${esc(type)}

<div class="features">

${features.map(
function(item){

return `

/* =========================================================
SHOW IMAGE
========================================================= */

function showImage(index){

if(!images.length){
return;
}

imageIndex =
index;

const image =
document.getElementById(
"mainImage"
);

if(image){

image.src =
images[index];

}

document
.querySelectorAll(
".thumbnail"
)
.forEach(
function(item,i){

item.classList.toggle(
"active",
i === index
);

});


const number =
document.getElementById(
"imageNumber"
);

if(number){
number.textContent =
index + 1;
}

}


/* =========================================================
NEXT IMAGE
========================================================= */

function nextImage(){

if(!images.length){
return;
}

imageIndex++;

if(
imageIndex >= images.length
){

imageIndex = 0;

}

showImage(
imageIndex
);

}


/* =========================================================
PREVIOUS IMAGE
========================================================= */

function prevImage(){

if(!images.length){
return;
}

imageIndex--;

if(imageIndex < 0){

imageIndex =
images.length - 1;

}

showImage(
imageIndex
);

}


/* =========================================================
DESCRIPTION
========================================================= */

function toggleDescription(){

const description =
document.getElementById(
"description"
);

const button =
document.getElementById(
"readMore"
);

if(!description){
return;
}

if(
description.classList.contains(
"expanded"
)
){

description.classList.remove(
"expanded"
);

button.textContent =
"View Full Description";

}else{

description.classList.add(
"expanded"
);

button.textContent =
"Hide Description";

}

}


/* =========================================================
FAVORITE
========================================================= */

function favorite(){

const buttons =
document.querySelectorAll(
".header-btn"
);

const favoriteButton =
buttons[1];

if(!favoriteButton){
return;
}

if(
favoriteButton.dataset.saved !== "true"
){

favoriteButton.dataset.saved =
"true";

favoriteButton.innerHTML =
"♥";

favoriteButton.style.color =
"#c40000";

}else{

favoriteButton.dataset.saved =
"false";

favoriteButton.innerHTML =
"♡";

favoriteButton.style.color =
"#222";

}

}

async function sharePage(){

});

}else{

);

}

}

history.length > 1
){

}

========================================================= */

document.addEventListener(
"keydown",
function(event){

if(event.key === "ArrowRight"){
nextImage();
}

if(event.key === "ArrowLeft"){
prevImage();
}

if(event.key === "Escape"){
goBack();
}

});

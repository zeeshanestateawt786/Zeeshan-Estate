<script>

/* =========================================================

const SUPABASE_URL =
"https://rhzsfjolkxqovhonylti.supabase.co";

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

if(value === null || value === undefined){

return "";

}

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================================
   PROPERTY ID
========================================================= */

const params =
new URLSearchParams(
window.location.search
);

const propertyId =
params.get("id");


/* =========================================================
   GALLERY VARIABLES
========================================================= */

let currentImage = 0;

let propertyImages = [];



/* =========================================================
   DATE FORMAT
========================================================= */

function getPostedTime(dateValue){

if(!dateValue){

return "Recently added";

}

const date =
new Date(dateValue);

if(isNaN(date.getTime())){

return "Recently added";

}

const now =
new Date();

const diff =
now - date;

const minutes =
Math.floor(
diff / 60000
);

const hours =
Math.floor(
minutes / 60
);

const days =
Math.floor(
hours / 24
);

if(minutes < 60){

return minutes <= 1
? "Just now"
: minutes + " minutes ago";

}

if(hours < 24){

return hours + (
hours === 1
? " hour ago"
: " hours ago"
);

}

if(days < 30){

return days + (
days === 1
? " day ago"
: " days ago"
);

}

return date.toLocaleDateString();

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(value){

if(value === null || value === undefined){

return "";

}

const text =
String(value).trim();

if(!text){

return "";

}

/*

If price already contains:
PKR / Crore / Lakh etc.
keep it exactly as entered.

*/

if(
/PKR|crore|lakh|lac|million/i.test(text)
){

return text;

}

const number =
Number(
text.replace(/,/g,"")
);

if(!isNaN(number)){

if(number >= 10000000){

return "PKR " +
(number / 10000000)
.toFixed(2)
.replace(/\.00$/,"") +
" Crore";

}

if(number >= 100000){

return "PKR " +
(number / 100000)
.toFixed(2)
.replace(/\.00$/,"") +
" Lakh";

}

return "PKR " +
number.toLocaleString();

}

return text;

}


/* =========================================================
   GET AMENITIES
========================================================= */

function getAmenities(property){

const amenities = [];


/*

These fields will work if they exist
in your Supabase properties table.

*/

const fields = [

["possession","Possession"],

["water_supply","Water Supply"],

["sewerage","Sewerage"],

["sui_gas","Sui Gas"],

["electricity","Electricity"],

["boundary_wall","Boundary Wall"],

["corner","Corner"],

["park_facing","Park Facing"],

["main_boulevard","Main Boulevard"],

["gated_community","Gated Community"],

["security","Security"],

["near_park","Near Park"],

["near_mosque","Near Mosque"],

["near_school","Near School"],

["near_market","Near Market"],

["developed","Developed"]

];


fields.forEach(function(item){

const key =
item[0];

const label =
item[1];

if(
property[key] !== undefined &&
property[key] !== null &&
String(property[key]).trim() !== ""
){

let value =
property[key];

if(
typeof value === "boolean"
){

value =
value ? "Yes" : "No";

}

amenities.push({

label:label,

value:String(value)

});

}

});


/*

If an amenities array/object/json field
already exists, use it too.

*/

if(
property.amenities
){

try{

let extra =
property.amenities;

if(
typeof extra === "string"
){

extra =
JSON.parse(extra);

}

if(
Array.isArray(extra)
){

extra.forEach(function(item){

if(
typeof item === "string"
){

amenities.push({

label:item,
value:"Yes"

});

}

else if(
item &&
typeof item === "object"
){

const label =
item.label ||
item.name ||
item.title;

const value =
item.value !== undefined
? item.value
: "Yes";

if(label){

amenities.push({

label:String(label),
value:String(value)

});

}

}

});

}

else if(
extra &&
typeof extra === "object"
){

Object.keys(extra)
.forEach(function(key){

amenities.push({

label:key
.replace(/_/g," ")
.replace(/\b\w/g,function(c){
return c.toUpperCase();
}),

value:String(
extra[key]
)

});

});

}

}catch(error){

console.log(
"Amenities JSON could not be parsed."
);

}

}


/* Remove duplicate amenities */

const unique = [];

amenities.forEach(function(item){

const exists =
unique.some(function(existing){

return existing.label.toLowerCase()
=== item.label.toLowerCase();

});

if(!exists){

unique.push(item);

}

});


return unique;

}


/* =========================================================
   BUILD GALLERY

function buildGallery(images){

if(!images.length){

return `

<div class="gallery-section">

<div class="gallery"
style="
display:flex;

`;

}


return `

<div
class="gallery"
id="gallery">

<div
class="gallery-track"
id="galleryTrack">

${images.map(function(url,index){

return `

<div class="gallery-slide">

<img

alt="Property Image ${index + 1}"
loading="${index === 0 ? "eager" : "lazy"}"
decoding="async">

}).join("")}

</div>


${

`

‹

<button
class="gallery-arrow right"

`

:

""

<div class="image-count">

▧
<span id="imageNumber">1</span>/${images.length}

</div>


${
images.length > 1
?

`

<div
class="dots">

${images.map(function(_,index){

return `

<div
class="dot ${index === 0 ? "active" : ""}"
id="dot-${index}">
</div>

`;

</div>

`

</div>

/* =========================================================
   UPDATE GALLERY
========================================================= */

function updateGallery(){

const track =
document.getElementById(
"galleryTrack"
);

if(!track){

return;

}

track.style.transform =
"translateX(-" +
(currentImage * 100) +
"%)";


const number =
document.getElementById(
"imageNumber"
);

if(number){

number.textContent =
currentImage + 1;

}


document
.querySelectorAll(".dot")
.forEach(function(dot,index){

dot.classList.toggle(
"active",
index === currentImage
);

});

}


/* =========================================================
   NEXT IMAGE
========================================================= */

function nextImage(){

if(!propertyImages.length){

return;

}

currentImage++;

if(
currentImage >= propertyImages.length
){

currentImage = 0;

}

updateGallery();

}


/* =========================================================
   PREVIOUS IMAGE
========================================================= */

function previousImage(){

if(!propertyImages.length){

return;

}

currentImage--;

if(currentImage < 0){

currentImage =
propertyImages.length - 1;

}

updateGallery();

}


/* =========================================================
   SWIPE SUPPORT
========================================================= */

let touchStartX = 0;

let touchEndX = 0;


document.addEventListener(
"touchstart",
function(event){

if(
event.touches &&
event.touches.length
){

touchStartX =
event.touches[0].clientX;

}

},
{passive:true}
);


document.addEventListener(
"touchend",
function(event){

if(
!propertyImages.length
){

return;

}

if(
event.changedTouches &&
event.changedTouches.length
){

touchEndX =
event.changedTouches[0].clientX;

}

const difference =
touchStartX - touchEndX;


if(Math.abs(difference) < 50){

return;

}

if(difference > 0){

nextImage();

}else{

previousImage();

}

},
{passive:true}
);

async function loadProperty(){

const container =
document.getElementById(
"property-container"
);


if(!propertyId){

container.innerHTML = `

<div class="error">

❌ Property ID not found.

<br><br>

<a href="index.html">

← Back to Website

</a>

</div>

`;

return;

}

const result =
await supabaseClient

.from("properties")

.select("*")

.eq("id",propertyId)

.single();


if(result.error){

throw result.error;

}


const property =
result.data;


if(!property){

throw new Error(
"Property not found."
);

}


/* =====================================================
   IMAGES
===================================================== */

propertyImages = [];


if(
Array.isArray(
property.image_urls
)
){

propertyImages =
property.image_urls.filter(
function(url){

return url &&
typeof url === "string";

}
);

}

   BASIC VALUES
===================================================== */

const propertyType =
property.property_type ||
"Property for Sale";


const purpose =
property.purpose ||
"";


const price =
formatPrice(
property.price
);


const location =
property.location ||
"AWT Phase 2, Lahore";


const size =
property.property_size ||
"";


const details =
property.details ||
"Property details are not available.";

getPostedTime(
property.created_at ||
property.updated_at
);

===================================================== */

getAmenities(property);

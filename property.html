<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://rhzsfjolkxqovhonylti.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DjOGYqDCgPNMngD7mwMmcw_BM-UUCg8";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
PROPERTY ID
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

const propertyId =
params.get("id");


/* =====================================================
GLOBAL DATA
===================================================== */

let images = [];

let imageIndex = 0;

let currentProperty = null;


/* =====================================================
ESCAPE HTML
===================================================== */

function esc(value){

if(
value === null ||
value === undefined
){

return "";

}

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
PRICE FORMAT
===================================================== */

function priceText(value){

if(
value === null ||
value === undefined ||
String(value).trim() === ""
){

return "Price on Call";

}

const text =
String(value).trim();


if(
/PKR|lakh|lac|crore|million|arab/i.test(text)
){

return text;

}


const number =
Number(
text.replace(/,/g,"")
);


if(
isNaN(number)
){

return text;

}


if(number >= 10000000){

return "PKR " +
(
number / 10000000
)
.toFixed(2)
.replace(".00","") +
" Crore";

}


if(number >= 100000){

return "PKR " +
(
number / 100000
)
.toFixed(2)
.replace(".00","") +
" Lakh";

}


return "PKR " +
number.toLocaleString();

}


/* =====================================================
POSTED DATE
===================================================== */

function postedDate(value){

if(!value){
return "Recently added";
}

const date =
new Date(value);

if(
isNaN(date.getTime())
){

return "Recently added";

}

const days =
Math.floor(
(
Date.now() -
date.getTime()
) /
86400000
);

if(days <= 0){
return "Added today";
}

if(days === 1){
return "Added 1 day ago";
}

if(days < 30){

return "Added " +
days +
" days ago";

}

return "Added on " +
date.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}


/* =====================================================
LOAD PROPERTY
===================================================== */
async function loadProperty(){

    const container = document.getElementById("propertyContainer");

    if(!propertyId){
        showError("Property ID missing.");
        return;
    }

    try{

        const idNumber = Number(propertyId);

        if(!Number.isInteger(idNumber)){
            showError("Invalid Property ID: " + propertyId);
            return;
        }

        console.log("Loading property ID:", idNumber);

        const { data, error } = await supabaseClient
            .from("properties")
            .select("*")
            .eq("id", idNumber)
            .limit(1);

        console.log("Supabase data:", data);
        console.log("Supabase error:", error);

        if(error){
            throw error;
        }

        if(!data || data.length === 0){
            showError(
                "Property ID " +
                idNumber +
                " nahi mili. Supabase properties table mein ye property available nahi hai."
            );
            return;
        }

        const property = data[0];

        currentProperty = property;

        /* =========================
           IMAGES
        ========================= */

        images = [];

        if(Array.isArray(property.image_urls)){

            images = property.image_urls.filter(function(url){

                return (
                    typeof url === "string" &&
                    url.trim() !== ""
                );

            });

        }

        /* =========================
           DATA
        ========================= */

        const type =
            property.property_type || "Property";

        const purpose =
            property.purpose || "Sale";

        const size =
            property.property_size || "Not specified";

        const location =
            property.location ||
            "Army Welfare Trust Phase 2, Lahore";

        const details =
            property.details ||
            "No description available.";

        const price =
            priceText(property.price);

        const posted =
            postedDate(property.created_at);


        /* =========================
           GALLERY
        ========================= */

        let galleryHTML = "";

        if(images.length > 0){

            galleryHTML = `

            <div class="gallery">

                <div class="gallery-main">

                    <img
                        id="mainImage"
                        src="${esc(images[0])}"
                        alt="${esc(type)} for ${esc(purpose)}"
                    >

                    ${
                        images.length > 1
                        ?
                        `

                        <button
                            class="gallery-arrow left"
                            onclick="prevImage()"
                            aria-label="Previous image">
                            ‹
                        </button>

                        <button
                            class="gallery-arrow right"
                            onclick="nextImage()"
                            aria-label="Next image">
                            ›
                        </button>

                        `
                        :
                        ""
                    }

                    <div class="gallery-count">
                        📷
                        <span id="imageNumber">1</span>
                        /
                        ${images.length}
                    </div>

                </div>

                ${
                    images.length > 1
                    ?
                    `

                    <div class="gallery-thumbs">

                        ${images.map(function(url,index){

                            return `

                            <img
                                class="gallery-thumb ${
                                    index === 0 ? "active" : ""
                                }"
                                src="${esc(url)}"
                                onclick="showImage(${index})"
                                alt="Property image ${index + 1}"
                                loading="lazy"
                            >

                            `;

                        }).join("")}

                    </div>

                    `
                    :
                    ""
                }

            </div>

            `;

        }else{

            galleryHTML = `

            <div class="gallery">

                <div class="gallery-main">

                    <div class="gallery-empty">
                        📷 No Property Image
                    </div>

                </div>

            </div>

            `;

        }


        /* =========================
           FEATURES
        ========================= */

        let features = [];

        [
            property.property_type,
            property.property_size,
            property.purpose,
            "Army Welfare Trust Phase 2",
            "Prime Location",
            "Zeeshan Estate Authorized Dealer"
        ].forEach(function(item){

            if(
                item &&
                String(item).trim()
            ){

                features.push(
                    String(item).trim()
                );

            }

        });

        features = [...new Set(features)];


        /* =========================
           PAGE TITLE
        ========================= */

        document.title =
            type +
            " " +
            purpose +
            " | Zeeshan Estate AWT";


        /* =========================
           DISPLAY PROPERTY
        ========================= */

        container.className = "";

        container.innerHTML = `

        ${galleryHTML}

        <div class="property-main">

            <div class="property-head">

                <div class="property-title">

                    ${esc(type)}

                    ${
                        purpose
                        ? " for " + esc(purpose)
                        : ""
                    }

                </div>

                <div class="property-location">

                    📍 ${esc(location)}

                </div>

                <div class="property-price">

                    ${esc(price)}

                </div>

                <div class="property-posted">

                    ${esc(posted)}

                </div>

            </div>


            <div class="quick-info">

                <div class="quick-item">

                    <div class="quick-label">
                        Property Type
                    </div>

                    <div class="quick-value">
                        ${esc(type)}
                    </div>

                </div>


                <div class="quick-item">

                    <div class="quick-label">
                        Purpose
                    </div>

                    <div class="quick-value">
                        ${esc(purpose)}
                    </div>

                </div>


                <div class="quick-item">

                    <div class="quick-label">
                        Property Size
                    </div>

                    <div class="quick-value">
                        ${esc(size)}
                    </div>

                </div>


                <div class="quick-item">

                    <div class="quick-label">
                        Location
                    </div>

                    <div class="quick-value">
                        ${esc(location)}
                    </div>

                </div>

            </div>

        </div>


        <div class="content">

            <div class="left">

                <section class="box">

                    <h2 class="box-title">
                        Property Description
                    </h2>

                    <div
                        class="description"
                        id="description"
                    >
                        ${esc(details)}
                    </div>

                    <button
                        class="read-more"
                        onclick="toggleDescription()"
                        id="readMore"
                    >
                        View Full Description
                    </button>

                </section>


                <section class="box">

                    <h2 class="box-title">
                        Features &amp; Amenities
                    </h2>

                    <div class="features">

                        ${features.map(function(item){

                            return `

                            <div class="feature">

                                <div class="feature-icon">
                                    ✓
                                </div>

                                <div>
                                    ${esc(item)}
                                </div>

                            </div>

                            `;

                        }).join("")}

                    </div>

                </section>


                <section class="box">

                    <h2 class="box-title">
                        Property Details
                    </h2>

                    <div class="details">

                        <div class="detail">

                            <div class="detail-label">
                                PROPERTY TYPE
                            </div>

                            <div class="detail-value">
                                ${esc(type)}
                            </div>

                        </div>


                        <div class="detail">

                            <div class="detail-label">
                                PURPOSE
                            </div>

                            <div class="detail-value">
                                ${esc(purpose)}
                            </div>

                        </div>

/* =====================================================
IMAGE
===================================================== */

function showImage(index){

if(!images.length){
return;
}

if(index < 0){
index = 0;
}

if(index >= images.length){
index = images.length - 1;
}

imageIndex =
index;


const image =
document.getElementById(
"mainImage"
);

if(image){

image.src =
images[index];

}


document
.querySelectorAll(
".gallery-thumb"
)
.forEach(
function(item,i){

item.classList.toggle(
"active",
i === index
);

});


const number =
document.getElementById(
"imageNumber"
);

if(number){

number.textContent =
index + 1;

}

}


/* =====================================================
NEXT IMAGE
===================================================== */

function nextImage(){

if(!images.length){
return;
}

imageIndex++;

if(
imageIndex >= images.length
){

imageIndex = 0;

}

showImage(
imageIndex
);

}


/* =====================================================
PREVIOUS IMAGE
===================================================== */

function prevImage(){

if(!images.length){
return;
}

imageIndex--;

if(
imageIndex < 0
){

imageIndex =
images.length - 1;

}

showImage(
imageIndex
);

}

function toggleDescription(){

const description =
document.getElementById(
"description"
);

const button =
document.getElementById(
"readMore"
);


if(!description ||
!button){

return;

}


if(
description.classList.contains(
"expanded"
)
){

description.classList.remove(
"expanded"
);

button.textContent =
"View Full Description";

}else{

description.classList.add(
"expanded"
);

button.textContent =
"Hide Description";

}

}

/* =====================================================
PROPERTY VIEW TRACKING
===================================================== */

async function recordPropertyView(id){

try{

if(!id){
return;
}

const visitorKey =
"property_view_" +
id;

if(
sessionStorage.getItem(
visitorKey
)
){

return;

}

sessionStorage.setItem(
visitorKey,
"1"
);


let visitorId =
localStorage.getItem(
"zeeshan_estate_visitor_id"
);


if(!visitorId){

visitorId =
"v-" +
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2,10);

localStorage.setItem(
"zeeshan_estate_visitor_id",
visitorId
);

}


const result =
await supabaseClient
.from("property_views")
.insert([{

property_id:id,

visitor_id:visitorId

}]);


if(result.error){

console.log(
"View tracking skipped:",
result.error.message
);

}

}catch(error){

console.log(
"View tracking error:",
error.message
);

}

}


/* =====================================================
KEYBOARD GALLERY
===================================================== */

document.addEventListener(
"keydown",
function(event){

if(!images.length){
return;
}

if(event.key === "ArrowRight"){

nextImage();

}

if(event.key === "ArrowLeft"){

prevImage();

}

if(event.key === "Escape"){

goBack();

}

});


/* =====================================================
TOUCH SWIPE GALLERY
===================================================== */

let touchStartX = 0;

let touchEndX = 0;


document.addEventListener(
"touchstart",
function(event){

if(
event.touches.length === 1
){

touchStartX =
event.touches[0].clientX;

}

},
{
passive:true
});


document.addEventListener(
"touchend",
function(event){

if(
event.changedTouches.length !== 1
){

return;

}

touchEndX =
event.changedTouches[0].clientX;

const distance =
touchEndX -
touchStartX;


if(
Math.abs(distance) < 60
){

return;

}


if(distance < 0){

nextImage();

}else{

prevImage();

}

},
{
passive:true
});

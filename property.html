<script>

/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://rhzsfjolkxqovhonylti.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DjOGYqDCgPNMngD7mwMmcw_BM-UUCg8";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
ESCAPE HTML
========================================= */

function escapeHTML(value){

if(value === null || value === undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
GET PROPERTY ID FROM URL
========================================= */

const params =
new URLSearchParams(
window.location.search
);

const propertyId =
params.get("id");


/* =========================================
LOAD PROPERTY
========================================= */

async function loadProperty(){

const container =
document.getElementById(
"property-container"
);

if(!propertyId){

container.innerHTML = `
<div class="error">
❌ Property ID not found.
<br><br>
<a href="index.html"
style="color:#b40000;font-weight:800">
← Back to Website
</a>
</div>
`;

return;

}

try{

const result =
await supabaseClient
.from("properties")
.select("*")
.eq("id",propertyId)
.single();

if(result.error){

throw result.error;

}

const property =
result.data;

if(!property){

throw new Error(
"Property not found."
);

}


/* =========================================
IMAGES
========================================= */

let images = [];

if(Array.isArray(property.image_urls)){

images =
property.image_urls.filter(
function(url){
return url;
}
);

}


/* =========================================
GALLERY
========================================= */

let galleryHTML = "";

if(images.length > 0){

galleryHTML = `

<div class="gallery ${
images.length === 1 ? "single" : ""
}">

${images
.map(function(url){

return `

<img
src="${escapeHTML(url)}"
alt="Property - Zeeshan Estate AWT"
loading="lazy"
onclick="openImage('${escapeHTML(url)}')">

`;

})
.join("")}

</div>

`;

}else{

galleryHTML = `

<div style="
height:300px;
display:flex;
align-items:center;
justify-content:center;
background:#eee;
color:#777;
font-size:20px">

📷 No property pictures available

</div>

`;

}


/* =========================================
PAGE CONTENT
========================================= */

container.innerHTML = `

<div class="title">

<h1>
${escapeHTML(
property.property_type
)}
</h1>

<p>
${escapeHTML(
property.purpose
)}
</p>

</div>

${galleryHTML}

<div class="details">

<div class="price">

${escapeHTML(
property.price
)}

</div>

<div class="info-grid">

<div class="info">

<b>PROPERTY TYPE</b>

${escapeHTML(
property.property_type
)}

</div>

<div class="info">

<b>PURPOSE</b>

${escapeHTML(
property.purpose
)}

</div>

<div class="info">

<b>PROPERTY SIZE</b>

${escapeHTML(
property.property_size
)}

</div>

<div class="info">

<b>LOCATION</b>

📍 ${escapeHTML(
property.location
)}

</div>

</div>

<div class="description">

<h2>
Property Details
</h2>

<p>
${escapeHTML(
property.details ||
"No additional details provided."
)}
</p>

</div>

<div class="contact">

<h2>
Interested in this Property?
</h2>

<p>
For Booking &amp; Details
</p>

<p>
<b>Eng. Ahsan Ali</b>
</p>

<a
href="tel:+923020941013"
class="call-btn">

📞 CALL 0302-0941013

</a>

</div>

</div>

`;

}catch(error){

console.error(
"PROPERTY PAGE ERROR:",
error
);

container.innerHTML = `

<div class="error">

❌ Property load nahi ho saki.

<br><br>

<small>
${escapeHTML(
error.message
)}
</small>

<br><br>

<a
href="index.html"
style="color:#b40000;font-weight:800">

← Back to Website

</a>

</div>

`;

}

}


/* =========================================
IMAGE VIEW
========================================= */

function openImage(url){

window.open(
url,
"_blank"
);

}


/* =========================================
START
========================================= */

document.addEventListener(
"DOMContentLoaded",
function(){

loadProperty();

});

</script>

</body>

</html>

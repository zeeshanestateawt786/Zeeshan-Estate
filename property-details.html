<script>
const SUPABASE_URL="https://rhzsfjolkxqovhonylti.supabase.co",SUPABASE_KEY="sb_publishable_DjOGYqDCgPNMngD7mwMmcw_BM-UUCg8",sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>v==null?"":String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const id=new URLSearchParams(location.search).get("id");
let imgs=[],current=0;
function show(i){current=i;const main=document.getElementById("main");if(main&&imgs[i])main.src=imgs[i];document.querySelectorAll(".thumbs img").forEach((x,n)=>x.classList.toggle("active",n===i))}

 const r=await sb.from("properties").select("*").eq("id",id).single();
 if(r.error||!r.data){app.innerHTML='<div class="error">Property not found.<br><a href="properties.html" style="color:#b40000">View Available Properties</a></div>';return}

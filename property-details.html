/* =========================================================
PRICE FORMAT
========================================================= */

function formatPrice(value){

if(
value === null ||
value === undefined ||
value === ""
){

return "Price on Call";

}

let text =
String(value).trim();


if(
/crore|lac|lakh|pkr/i.test(text)
){

if(
!/pkr/i.test(text)
){

return "PKR " + text;

}

return text;

}


let number =
Number(
text.replace(
/[^0-9.]/g,
""
)
);


if(
!isNaN(number) &&
number > 0
){

if(
number >= 10000000
){

return "PKR " +
(number / 10000000)
.toFixed(2)
.replace(/\.00$/,"") +
" Crore";

}


if(
number >= 100000
){

return "PKR " +
(number / 100000)
.toFixed(2)
.replace(/\.00$/,"") +
" Lac";

}


return "PKR " +
number.toLocaleString();

}


return text;

}


/* =========================================================
BOOLEAN
========================================================= */

function isTrue(value){

return value === true ||
value === "true" ||
value === 1 ||
value === "1" ||
value === "yes" ||
value === "Yes";

}

/* =========================================================

========================================================= */

function normalizeWhatsApp(phone){

let number =
String(phone || "")
.replace(/\D/g,"");


if(number.startsWith("0")){

number =
"92"+
number.substring(1);

}


if(!number.startsWith("92")){

number =
"92"+
number;

}


return number;

}

.neq("id",current.id)
.limit(6);


if(current.property_size){

query =
query.eq(
"property_size",
current.property_size
);

let result =
await query;


if(
result.error ||
!result.data ||
result.data.length === 0
){

result =
await supabaseClient
.from("properties")
.select("*")
.neq("id",current.id)
.order(
"created_at",
{
ascending:false
}
)
.limit(6);

}


if(result.error){

return;

}


renderSimilar(
result.data || []
);


}catch(error){

console.log(error);

}

}

/* =========================================================
TOUCH SWIPE
========================================================= */

let touchStartX = 0;


document.addEventListener(
"touchstart",
function(e){

if(e.touches.length !== 1){

return;

}

touchStartX =
e.touches[0].clientX;

},
{
passive:true
}
);


document.addEventListener(
"touchend",
function(e){

if(!touchStartX){

return;

}


const touchEndX =
e.changedTouches[0].clientX;


const difference =
touchStartX - touchEndX;


if(
Math.abs(difference) > 50
){

if(difference > 0){

nextImage();

}else{

previousImage();

}

}


touchStartX = 0;

},
{
passive:true
}
);

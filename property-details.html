<style>

/* ================= RESET ================= */

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;

/* ================= TOP BAR ================= */

.topbar{
background:#b40000;
color:#fff;
padding:9px 5%;

display:flex;
justify-content:space-between;
flex-wrap:wrap;

gap:15px;

font-size:13px;
font-weight:700;
}


/* ================= HEADER ================= */

.header{
background:#fff;

position:sticky;
top:0;
z-index:1000;

box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.nav{
max-width:1300px;
margin:auto;

min-height:75px;

padding:12px 20px;

display:flex;
align-items:center;

}

.logo{

}

.menu{
display:flex;

}

.menu a{
padding:10px 12px;

font-size:12px;
font-weight:800;

.menu a:hover{
color:#b40000;
background:#fff3f3;
}

.list-btn{
background:#c40000;

/* ================= MAIN ================= */

.container{
max-width:1250px;
margin:auto;

padding:15px 18px 60px;
}


/* ================= PROPERTY GALLERY ================= */

.gallery{
background:#111;

border-radius:10px;

overflow:hidden;

position:relative;

height:520px;

display:flex;
align-items:center;
justify-content:center;
}

.main-image{
width:100%;
height:100%;

object-fit:contain;

background:#111;

display:block;
}

.gallery-count{
position:absolute;

left:15px;
bottom:15px;

background:rgba(0,0,0,.78);

color:#fff;

padding:8px 12px;

border-radius:5px;

font-size:12px;
font-weight:800;
}


/* ================= THUMBNAILS ================= */

.thumbs{
display:flex;

gap:8px;

overflow-x:auto;

background:#fff;

padding:10px;

border:1px solid #eee;
border-top:0;

border-radius:0 0 8px 8px;
}

.thumb{
width:90px;
height:65px;

flex:0 0 auto;

object-fit:cover;

border-radius:5px;

cursor:pointer;

border:2px solid transparent;
}

.thumb.active{
border-color:#c40000;
}


/* ================= BREADCRUMB ================= */

.breadcrumb{
padding:15px 3px 5px;

font-size:13px;

color:#777;
}

.breadcrumb a{
color:#b40000;

font-weight:700;
}


/* ================= MAIN GRID ================= */

.details-grid{
display:grid;

grid-template-columns:1fr 340px;

gap:22px;

}


/* ================= DETAILS CARD ================= */

.details-card{
background:#fff;

border-radius:10px;

border:1px solid #e5e5e5;

padding:25px;

box-shadow:0 4px 18px rgba(0,0,0,.06);

.badge{
display:inline-block;

background:#c40000;

color:#fff;

padding:7px 12px;

border-radius:4px;

font-size:11px;

font-weight:900;

margin-bottom:12px;
}


/* ================= VERIFIED ================= */

.verified-badge{
display:inline-flex;

align-items:center;

gap:5px;

background:#168c3b;

color:#fff;

padding:7px 11px;

border-radius:4px;

font-size:11px;

font-weight:900;

margin-left:5px;

margin-bottom:12px;
}


/* ================= PRICE ================= */

.price{

font-weight:900;

/* ================= TITLE ================= */

}

.location{

/* ================= INFO GRID ================= */

.info-grid{

grid-template-columns:1fr 1fr;

gap:12px;

margin-top:22px;

border-top:1px solid #eee;

/* ================= DESCRIPTION ================= */

}

.description h2{

}

.description p{

}


/* ================= CONTACT CARD ================= */

.contact-card{

border-radius:10px;

border:1px solid #e5e5e5;

padding:22px;

height:max-content;

}

.contact-card h2{
font-size:20px;

margin-bottom:5px;
}

.contact-card p{
color:#777;

font-size:13px;

margin-bottom:18px;
}

.contact-name{

}

.contact-phone{

margin-bottom:18px;
}


/* ================= BUTTONS ================= */

.contact-btn{
width:100%;

min-height:48px;

display:flex;

align-items:center;

justify-content:center;

border-radius:6px;

margin-top:9px;

font-size:14px;

}

.call-btn{
background:#c40000;

color:#fff;
}

.call-btn:hover{
background:#920000;
}

.wa-btn{
background:#168a4b;

color:#fff;
}

.wa-btn:hover{
background:#116d3b;
}

.back-btn{
border:1px solid #ddd;

}


/* ================= PROPERTY ID ================= */

.property-id{
margin-top:18px;

padding-top:15px;

border-top:1px solid #eee;

color:#888;

font-size:11px;
}


/* ================= LOADING ================= */

.loading{
max-width:700px;

margin:70px auto;

text-align:center;

color:#777;
}

.loader{
width:45px;
height:45px;

border:4px solid #eee;

border-top-color:#c40000;

border-radius:50%;

animation:spin .8s linear infinite;

margin:0 auto 15px;
}

@keyframes spin{

to{
transform:rotate(360deg);
}

}


/* ================= ERROR ================= */

.error{
max-width:700px;

margin:60px auto;

background:#fff;

padding:50px 25px;

text-align:center;

border-radius:10px;

box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.error h2{
margin-bottom:10px;
}

color:#777;
}

.error a{
display:inline-flex;

margin-top:20px;

padding:12px 20px;

background:#c40000;

}


/* ================= FOOTER ================= */

.footer{
background:#151515;

@media(max-width:550px){

/* ================= VERY SMALL MOBILE ================= */

}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://rhzsfjolkxqovhonylti.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DjOGYqDCgPNMngD7mwMmcw_BM-UUCg8";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ================= ESCAPE ================= */

function esc(value){

if(value == null){

return "";

}

return String(value).replace(
/[&<>"']/g,

function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c];

});

}


/* ================= GET PROPERTY ID ================= */

const params =
new URLSearchParams(
window.location.search
);

const propertyId =
params.get("id");


const main =
document.getElementById("main");


/* ================= CHECK ID ================= */

if(!propertyId){

main.innerHTML = `

<div class="error">

<h2>
Property Not Found
</h2>

<p>
No property ID was provided.
</p>

<a href="properties.html">
← Back to Properties
</a>

</div>

`;

}else{

loadProperty();

}


/* ================= LOAD PROPERTY ================= */

async function loadProperty(){

try{

const result =
await supabaseClient
.from("properties")
.select("*")
.eq("id",propertyId)
.single();


if(result.error){

throw result.error;

}


const p =
result.data;


if(!p){

throw new Error(
"Property not found."
);

}


renderProperty(p);


}catch(error){

console.error(error);


main.innerHTML = `

<div class="error">

<h2>
Property Not Found
</h2>

<p>
This property may have been removed or is no longer available.
</p>

<a href="properties.html">
← Back to Properties
</a>

</div>

`;

}

}


/* ================= RENDER PROPERTY ================= */

function renderProperty(p){


/* ================= IMAGES ================= */

const images =
Array.isArray(p.image_urls)

? p.image_urls.filter(Boolean)

: [];


/* ================= DATA ================= */

const purpose =
p.purpose ||
"For Sale";


const type =
p.property_type ||
"Property";


const size =
p.property_size ||
"N/A";


const price =
p.price ||
"Price on Call";


const location =
p.location ||
"Army Welfare Trust Phase 2, Lahore";


const details =
p.details ||
"No additional property details have been provided.";


const owner =
p.owner_name ||
"Zeeshan Estate AWT";


const phone =
p.owner_phone ||
"0302-0941013";


const phoneHref =
phone.replace(
/[^0-9+]/g,
""
);


/* ================= WHATSAPP ================= */

const whatsappMessage =
"I am interested in this property. Property ID: " +
p.id;


let whatsappPhone =
phone.replace(/\D/g,"");


if(whatsappPhone.startsWith("0")){

whatsappPhone =
"92" +
whatsappPhone.substring(1);

}


/* ================= MAIN IMAGE ================= */

const mainImage =
images[0] || "";


const imageHTML = mainImage

?

`

<img

id="mainImage"

class="main-image"

src="${esc(mainImage)}"

alt="${esc(type)}"

loading="eager"

>

`

:

`

<div

class="main-image"

style="

display:flex;

align-items:center;

justify-content:center;

color:#fff;

font-size:80px;

"

>

🏠

</div>

`;


/* ================= THUMBNAILS ================= */

const thumbsHTML =
images.length

?

images.map(

function(url,index){

return `

<img

class="thumb ${index === 0 ? "active" : ""}"

src="${esc(url)}"

alt="Property image ${index+1}"

data-image="${esc(url)}"

loading="lazy"

>

`;

}

).join("")

:

"";


/* ================= PAGE ================= */

main.innerHTML = `


<!-- ================= PROPERTY PICTURE ================= -->

<div class="gallery">

${imageHTML}


<div class="gallery-count">

📷 ${images.length || 0} Photos

</div>


</div>


<!-- ================= THUMBNAILS ================= -->

${

images.length > 1

?

`

<div class="thumbs">

${thumbsHTML}

</div>

`

:

""

}


<!-- ================= BREADCRUMB ================= -->

<div class="breadcrumb">

<a href="properties.html">
Properties
</a>

&nbsp;›&nbsp;

Property Details

</div>


<!-- ================= DETAILS GRID ================= -->

<div class="details-grid">


<!-- ================= LEFT ================= -->

<section class="details-card">


<!-- BADGES -->

<div>

<span class="badge">

${esc(purpose)}

</span>


<span class="verified-badge">

✓ VERIFIED

</span>

</div>


<!-- PRICE -->

<div class="price">

${esc(price)}

</div>


<!-- TITLE -->

<div class="title">

${esc(type)}

${
p.property_size

?

" • " +
esc(p.property_size)

:

""

}

</div>


<!-- LOCATION -->

<div class="location">

📍 ${esc(location)}

</div>


<!-- ================= INFO ================= -->

<div class="info-grid">


<div class="info">

<small>
Property Type
</small>

<strong>
${esc(type)}
</strong>

</div>


<div class="info">

<small>
Property Size
</small>

<strong>
${esc(size)}
</strong>

</div>


<div class="info">

<small>
Purpose
</small>

<strong>
${esc(purpose)}
</strong>

</div>


<div class="info">

<small>
Location
</small>

<strong>
${esc(location)}
</strong>

</div>


<div class="info">

<small>
Property ID
</small>

<strong>
${esc(p.id)}
</strong>

</div>


<div class="info">

<small>
Dealer
</small>

<strong>
Zeeshan Estate AWT
</strong>

</div>


</div>


<!-- ================= DESCRIPTION ================= -->

<div class="description">

<h2>
Property Details
</h2>

<p>
${esc(details)}
</p>

</div>


</section>


<!-- ================= CONTACT ================= -->

<aside class="contact-card">


<h2>
Interested in this property?
</h2>


<p>
Contact Zeeshan Estate AWT for booking and details.
</p>


<div class="contact-name">

${esc(owner)}

</div>


<div class="contact-phone">

📞 ${esc(phone)}

</div>


<!-- CALL -->

<a

class="contact-btn call-btn"

href="tel:${esc(phoneHref)}"

>

📞 CALL NOW

</a>


<!-- WHATSAPP -->

<a

class="contact-btn wa-btn"

target="_blank"

rel="noopener"

href="https://wa.me/${whatsappPhone}?text=${encodeURIComponent(whatsappMessage)}"

>

💬 WHATSAPP

</a>


<!-- BACK -->

<a

class="contact-btn back-btn"

href="properties.html"

>

← BACK TO PROPERTIES

</a>


<div class="property-id">

Property ID:

${esc(p.id)}

</div>


</aside>


</div>


`;


/* ================= THUMBNAIL CLICK ================= */

document
.querySelectorAll(".thumb")
.forEach(

function(thumb){

thumb.addEventListener(

"click",

function(){

const mainImage =
document.getElementById(
"mainImage"
);


if(!mainImage){

return;

}


mainImage.src =
this.dataset.image;


document
.querySelectorAll(".thumb")
.forEach(

function(t){

t.classList.remove(
"active"
);

}

);


this.classList.add(
"active"
);

}

);

}

);

}


</script>

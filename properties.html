<head>

lay:flex;gap:7px;margin-top:14px}.btn{flex:1;text-align:center;padding:10px 7px;border-radius:5px;text-decoration:none;font-weight:900;font-size:13px}.details{background:#c40000;color:#fff}.call{border:1px solid #c40000;color:#c40000}.wa{background:#198754;color:#fff}.empty{text-align:center;background:#fff;padding:60px;border-radius:10px;grid-column:1/-1}.loading{text-align:center;padding:50px;grid-column:1/-1}@media(max-width:850px){.nav{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}.nav{padding:14px}.buttons{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="top"><span>📍 Army Welfare Trust Phase 2, Lahore</span><span>📞 0302-0941013</span></div>
<header class="nav"><div><div class="logo">ZEESHAN <span>ESTATE AWT</span></div><div class="badge">AUTHORIZED DEALER</div></div>
<nav><a href="index.html">HOME</a><a href="properties.html" style="color:#c40000">PROPERTIES</a><a class="add" href="property.html">LIST YOUR PROPERTY</a><a href="index.html#contact">CONTACT</a></nav></header>
<section class="hero"><h1>AVAILABLE PROPERTIES</h1><p>Find your next property with Zeeshan Estate AWT</p></section>
<main class="wrap">
<div class="toolbar"><input id="search" placeholder="Search location, type or size..."><select id="purpose"><option value="">All</option><option>For Sale</option><option>For Rent</option></select><select id="sort"><option value="new">Newest First</option><option value="old">Oldest First</option></select></div>
<div id="grid" class="grid"><div class="loading">Loading available properties...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rhzsfjolkxqovhonylti.supabase.co",SUPABASE_KEY="sb_publishable_DjOGYqDCgPNMngD7mwMmcw_BM-UUCg8",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>v==null?"":String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let all=[];
async function load(){const r=await supabaseClient.from("properties").select("*").order("created_at",{ascending:false});if(r.error){grid.innerHTML='<div class="empty">Unable to load properties.<br><small>'+esc(r.error.message)+'</small></div>';return}all=r.data||[];render()}
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim(), p=document.getElementById("purpose").value;
 let list=all.filter(x=>(!p||x.purpose===p)&&(!q||[x.location,x.property_type,x.property_size,x.price,x.details].join(" ").toLowerCase().includes(q)));
 if(document.getElementById("sort").value==="old")list=list.slice().reverse();
 grid.innerHTML="";
 if(!list.length){grid.innerHTML='<div class="empty">🏠<br><br>No matching properties found.</div>';return}
 list.forEach(x=>{
   const imgs=Array.isArray(x.image_urls)?x.image_urls.filter(Boolean):[];
   const img=imgs[0]||"";
   grid.insertAdjacentHTML("beforeend",`<article class="card">
   <div class="photo">${img?`<img src="${esc(img)}" loading="lazy" alt="${esc(x.property_type||"Property")}">`:"<div style='height:100%;display:grid;place-items:center;font-size:55px'>🏠</div>"}
   <div class="badge2">${esc(x.purpose||"For Sale")}</div>${imgs.length?`<div class="count">📷 ${imgs.length}</div>`:""}</div>
   <div class="body"><div class="price">${esc(x.price||"Price on Call")}</div><div class="title">${esc(x.property_type||"Property")}${x.property_size?" • "+esc(x.property_size):""}</div>
   <div class="loc">📍 ${esc(x.location||"Army Welfare Trust Phase 2, Lahore")}</div>
   <div class="meta"><span>📐 ${esc(x.property_size||"N/A")}</span><span>🏠 ${esc(x.property_type||"Property")}</span></div>
   <div class="buttons"><a class="btn details" href="property-details.html?id=${encodeURIComponent(x.id)}">VIEW DETAILS</a><a class="btn call" href="tel:+923020941013">☎ CALL</a><a class="btn wa" target="_blank" href="https://wa.me/923020941013?text=${encodeURIComponent("I am interested in property ID "+x.id)}">WhatsApp</a></div></div></article>`);
 });
}
["search","purpose","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));
load();
</script>
</body></html>
